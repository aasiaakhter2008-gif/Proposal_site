<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="A little question for someone very special.">

  <title>One Little Question ✨</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <audio id="backgroundMusic" loop autoplay>
  <source src="./Song.m4a" type="audio/mpeg">
</audio>


  <main class="page">

    <!-- Decorative background -->
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <!-- Stars -->
    <div class="stars" aria-hidden="true">
      <span>✦</span>
      <span>✧</span>
      <span>✦</span>
      <span>·</span>
      <span>✧</span>
      <span>✦</span>
      <span>·</span>
      <span>✧</span>
    </div>

    <!-- Main proposal card -->
    <section class="card" id="card">

      <!-- Elegant crescent decoration -->
      <div class="moon-decoration" aria-hidden="true">
        <div class="crescent"></div>
        <span class="moon-star">✦</span>
      </div>

      <p class="eyebrow">
        Bismillah, one little question...
      </p>

      <h1 id="question">
        Will you be<br>
        my forever 🤗?
      </h1>

      <p class="subtitle" id="subtitle">
        Somewhere between all our conversations,
        you quietly became my favorite person.
      </p>

      <div class="button-area" id="buttonArea">

        <button class="btn yes-btn" id="yesBtn" type="button">
          Yes, In Shaa Allah 🤍
        </button>

        <button class="btn no-btn" id="noBtn" type="button">
          How dare you 😠
        </button>

      </div>

      <p class="little-note" id="littleNote">
        Choose carefully... I might be watching. 😊
      </p>

      <!-- Decorative divider -->
      <div class="divider">
        <span></span>
        <b>✦</b>
        <span></span>
      </div>

      <p class="footer-line">
        A little moment for two hearts ✨
      </p>

    </section>

    <p class="page-footer">
      made with love & a little bit of courage
    </p>

  </main>

  <script src="script.js"></script>

</body>

</html>
